name: Deploy Homexa webapp

on:
  push:
    branches:
      - develop  # deploy on pushes to develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_GHCR_USERNAME: ${{ secrets.DEPLOY_GHCR_USERNAME }}
      DEPLOY_GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}


    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Buildx (enables layer caching + smaller, more efficient builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Login to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_OWNER }}  # org name, e.g., afrisinc
          password: ${{ secrets.GHCR_TOKEN }}  # your PAT

      # Step 4: Build & push Docker image, caching layers in the GitHub Actions cache
      # so unchanged layers (deps, build stages) are reused across runs instead of
      # being rebuilt and re-pushed every time.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ secrets.GHCR_OWNER }}/homexa-webapp:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.homexa.rw' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 5: SSH deploy to VPS
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m

          # 🔐 PASS DEPLOY CREDS TO VPS
          envs: DEPLOY_GHCR_USERNAME,DEPLOY_GHCR_TOKEN
          script: |
            set -e
            APP_PATH="/opt/apps/homexa-webapp"
            cd $APP_PATH

            echo "$DEPLOY_GHCR_TOKEN" | docker login ghcr.io -u "$DEPLOY_GHCR_USERNAME" --password-stdin

            docker compose pull
            docker compose up -d
            docker image prune -af